name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: app

env:
  DATABASE_URL: "postgresql://fp_user:fp_password@localhost:5432/fantasy_portal_db?schema=public"
  NEXTAUTH_SECRET: "ci-placeholder-secret"
  NEXTAUTH_URL: "http://localhost:3000"
  MASTER_ENCRYPTION_KEY: "ci-placeholder-key-32-characters"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # NOTE: the codebase currently has ~185 pre-existing lint errors (mostly
      # @typescript-eslint/no-explicit-any and react-hooks rules from
      # eslint-config-next). Lint runs for visibility but doesn't block CI
      # until that debt is paid down — see docs/ACTION_PLAN.md item 14.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
