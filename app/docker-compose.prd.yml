services:
  # Next.js App (Prd)
  node_app_prd:
    container_name: fantasy_portal_node
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "25035:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=https://fantasyportal.duplecake.space
      - SPOTIFY_REDIRECT_URI=https://fantasyportal.duplecake.space/api/audio/spotify/callback
      - DATABASE_URL=postgresql://fp_user:fp_password@db_postgres_prd:5432/fantasy_portal_db?schema=public
      - REDIS_URL=redis://cache_redis_prd:6379
      - MINIO_ENDPOINT_INTERNAL=http://storage-minio-prd:9000
      - LOCAL_TTS_URL=http://local_tts:8000
      - LOCAL_IMAGE_URL=http://local_image:8000
      - LOCAL_TEXT_URL=http://local_text:8080
    networks:
      - duplecake-net
    depends_on:
      - db_postgres_prd
      - cache_redis_prd

  # PostgreSQL (Prd)
  db_postgres_prd:
    container_name: fantasy_portal_db_prd
    image: postgres:16.13-alpine3.23 # versão fixa (evita upgrade acidental ao recriar)
    restart: unless-stopped
    # Sem porta no host: o app acessa pela rede interna (auditoria 2026-11-26, M1).
    environment:
      POSTGRES_USER: fp_user
      POSTGRES_PASSWORD: fp_password
      POSTGRES_DB: fantasy_portal_db
    volumes:
      - ./database/prd/postgres:/var/lib/postgresql/data
    networks:
      - duplecake-net

  # Redis (Prd)
  cache_redis_prd:
    container_name: fantasy_portal_redis_prd
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./database/prd/redis:/data
    networks:
      - duplecake-net

  # MinIO (Prd)
  storage-minio-prd:
    container_name: fantasy_portal_minio_prd
    # Versão fixa. O MinIO tirou as imagens do Docker Hub: esta tag só existe localmente.
    # Se sumir: gunzip -c ../../backups/security-fixes-20261126/minio-image-RELEASE.2025-09-07.tar.gz | docker load
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      # Credenciais vêm do .env (as mesmas que o app usa)
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?defina MINIO_ACCESS_KEY no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?defina MINIO_SECRET_KEY no .env}
    volumes:
      - ./database/prd/minio:/data
    command: server /data --console-address ":9001"
    # Sem portas no host (auditoria 2026-11-26, A1). Console: abrir um túnel temporário se precisar.
    networks:
      - duplecake-net

networks:
  duplecake-net:
    external: true
