services:
  # Sidecar de TTS local (Kokoro + XTTS-v2, CPU). Fica no profile "local-ai" pra
  # nunca subir junto com `make dev`/`make prd` sem pedir explicitamente — os
  # toggles do admin já caem pra nuvem sozinhos se esse serviço não existir.
  local_tts:
    container_name: fantasy_portal_local_tts
    build:
      context: ../local-ai/tts
    restart: unless-stopped
    environment:
      - HF_HOME=/cache/hf
      - XDG_DATA_HOME=/cache/share
    volumes:
      - ./local-ai-models/tts:/cache
    networks:
      - duplecake-net
    profiles:
      - local-ai

  # Sidecar de imagem local (SD 1.5 + LCM-LoRA, GPU). Fila de 1 job por vez —
  # os 4GB da 1050 Ti não seguram mais que isso rodando ao mesmo tempo.
  local_image:
    container_name: fantasy_portal_local_image
    build:
      context: ../local-ai/image
    restart: unless-stopped
    environment:
      - HF_HOME=/cache
    volumes:
      - ./local-ai-models/image:/cache
    networks:
      - duplecake-net
    profiles:
      - local-ai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Sidecar de texto local (llama.cpp + Qwen2.5-3B, GPU). Imagem oficial do
  # llama.cpp já fala o protocolo da OpenAI, então nenhum código próprio é
  # necessário aqui — só apontar o modelo via -hf (baixa e cacheia sozinho).
  local_text:
    container_name: fantasy_portal_local_text
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    command:
      - -hf
      - bartowski/Qwen2.5-3B-Instruct-GGUF:Q4_K_M
      - --alias
      - qwen2.5-3b
      - -c
      - "8192"
      - -ngl
      - "99"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      # llama.cpp é um binário C++ — não lê a env var HF_HOME (convenção do
      # ecossistema Python), então o cache do -hf vai sempre em ~/.cache/huggingface.
      - ./local-ai-models/text:/root/.cache/huggingface
    networks:
      - duplecake-net
    profiles:
      - local-ai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  duplecake-net:
    external: true
