services:
  # Next.js App (Dev)
  node_app_dev:
    container_name: fantasy_portal_node_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "25039:3000"
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules  # volume nomeado: reaproveitado a cada recriação (o anônimo acumulava ~1 GB por restart)
    command: sh -c "npm install && npx prisma generate && npm run dev"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXTAUTH_URL=http://localhost:25039
      - SPOTIFY_REDIRECT_URI=http://127.0.0.1:25039/api/audio/spotify/callback
      - DATABASE_URL=postgresql://fp_user:fp_password@db_postgres_dev:5432/fantasy_portal_db?schema=public
      - REDIS_URL=redis://cache_redis_dev:6379
      - MINIO_ENDPOINT_INTERNAL=http://storage-minio-dev:9000
      - LOCAL_TTS_URL=http://local_tts:8000
      - LOCAL_IMAGE_URL=http://local_image:8000
      - LOCAL_TEXT_URL=http://local_text:8080
    networks:
      - duplecake-net
    depends_on:
      - db_postgres_dev
      - cache_redis_dev

  # PostgreSQL (Dev)
  db_postgres_dev:
    container_name: fantasy_portal_db_dev
    image: postgres:16.13-alpine3.23 # versão fixa (evita upgrade acidental ao recriar)
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: fp_user
      POSTGRES_PASSWORD: fp_password
      POSTGRES_DB: fantasy_portal_db
    volumes:
      - ./database/dev/postgres:/var/lib/postgresql/data
    networks:
      - duplecake-net

  # Redis (Dev)
  cache_redis_dev:
    container_name: fantasy_portal_redis_dev
    image: redis:7-alpine
    volumes:
      - ./database/dev/redis:/data
    networks:
      - duplecake-net

  # MinIO (Dev)
  storage-minio-dev:
    container_name: fantasy_portal_minio_dev
    # Mesma imagem fixa do prd (o MinIO tirou as imagens do Docker Hub)
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      # Mesmas credenciais que o app lê do .env
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?defina MINIO_ACCESS_KEY no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?defina MINIO_SECRET_KEY no .env}
    volumes:
      - ./database/dev/minio:/data
    command: server /data --console-address ":9001"
    ports:
      - "25041:9000"
      - "25042:9001"
    networks:
      - duplecake-net

networks:
  duplecake-net:
    external: true

volumes:
  node_modules_dev:
