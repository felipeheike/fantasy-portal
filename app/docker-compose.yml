services:
  # pgAdmin (Compartilhado entre Dev e Prd)
  pgadmin:
    container_name: fantasy_portal_pgadmin
    image: dpage/pgadmin4:9.15
    # Desligado por padrão (auditoria 2026-11-26, C3). Subir só quando precisar:
    #   make pgadmin-up   |   make pgadmin-down
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ./database/shared/pgadmin/servers.json:/pgadmin4/servers.json
      - ./database/shared/pgadmin/data:/var/lib/pgadmin
    ports:
      - "25036:80"
    networks:
      - duplecake-net

networks:
  duplecake-net:
    external: true
